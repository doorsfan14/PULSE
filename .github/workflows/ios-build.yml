name: iOS build and IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build PULSE for the iOS Simulator
        run: |
          xcodebuild \
            -project PULSE.xcodeproj \
            -scheme PULSE \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iOS device app
        run: |
          xcodebuild \
            -project PULSE.xcodeproj \
            -scheme PULSE \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "Firebase plist secret is not configured; skipping plist injection."
            exit 0
          fi

          PLIST_PATH="$RUNNER_TEMP/GoogleService-Info.plist"
          APP_PATH="build/Build/Products/Debug-iphoneos/PULSE.app"

          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > "$PLIST_PATH"
          plutil -lint "$PLIST_PATH"
          test -d "$APP_PATH"
          cp "$PLIST_PATH" "$APP_PATH/GoogleService-Info.plist"
          echo "Firebase configuration added to the app bundle."

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Debug-iphoneos/PULSE.app"
          test -d "$APP_PATH"
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/PULSE.app
          cd ipa
          /usr/bin/zip -qry ../PULSE-unsigned.ipa Payload
          cd ..
          test -s PULSE-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-unsigned-IPA
          path: PULSE-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
