<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>PULSE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#fff;--text:#171717;--secondary:#737373;--line:#e8e8e8;--surface:#f7f7f8;--blue:#3478f6;--avatar:#e7eaf0}
    @media(prefers-color-scheme:dark){:root{--bg:#000;--text:#f5f5f7;--secondary:#98989f;--line:#292929;--surface:#171719;--blue:#0a84ff;--avatar:#292a2e}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;-webkit-font-smoothing:antialiased}
    button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .app{max-width:680px;min-height:100vh;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);padding-bottom:calc(66px + env(safe-area-inset-bottom))}
    header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
    .wordmark{font-size:21px;font-weight:800;letter-spacing:-1.1px}.header-actions{display:flex;gap:16px;align-items:center}.icon-button{display:grid;place-items:center;width:34px;height:34px;border:0;background:transparent;border-radius:50%;color:var(--text)}.icon-button:hover{background:var(--surface)}svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .page-title{font-size:20px;font-weight:800;letter-spacing:-.6px;margin:0}
    .feed{display:block}.composer{display:flex;gap:12px;padding:17px 18px;border-bottom:8px solid var(--surface)}
    .avatar{width:42px;height:42px;border-radius:50%;background:var(--avatar);display:grid;place-items:center;flex-shrink:0;font-size:14px;font-weight:700;overflow:hidden;color:var(--text)}
    .composer-content{min-width:0;flex:1}.composer textarea{display:block;width:100%;resize:vertical;min-height:54px;max-height:180px;padding:7px 0;border:0;outline:none;background:transparent;color:var(--text);font-size:14px;line-height:1.6}.composer textarea::placeholder{color:var(--secondary)}
    .composer-footer{display:flex;justify-content:space-between;align-items:center;margin-top:7px}.count{font-size:11px;color:var(--secondary)}.count.over{color:#d93025}
    .primary{border:0;border-radius:999px;background:var(--blue);color:#fff;font-size:12px;font-weight:700;padding:9px 16px}.primary:disabled{opacity:.4;cursor:default}
    .post{padding:16px 18px 10px;border-bottom:1px solid var(--line)}.post-header{display:flex;align-items:center;gap:10px}.post-person{min-width:0;flex:1}.post-person strong{font-size:13px;font-weight:700}.handle,.time{font-size:12px;color:var(--secondary)}.post-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px}.more{border:0;background:transparent;color:var(--secondary);font-size:21px;line-height:1;padding:4px 7px}.post-text{font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 13px}
    .actions{display:flex;align-items:center;justify-content:space-between;max-width:420px;padding:2px 0}.action{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:7px 5px;color:var(--secondary);font-size:11px}.action svg{width:18px;height:18px}.action:hover{color:var(--blue)}.action.liked{color:#e5486d}.action.reposted{color:#15966a}
    .empty{padding:60px 25px;text-align:center;color:var(--secondary)}.empty strong{display:block;font-size:16px;color:var(--text);margin-bottom:8px}.empty p{font-size:13px;line-height:1.6;margin:0 auto;max-width:290px}
    .profile{display:none}.profile-cover{height:145px;background:var(--surface);border-bottom:1px solid var(--line)}.profile-details{padding:0 18px 20px;border-bottom:8px solid var(--surface)}.profile-top{display:flex;align-items:flex-end;justify-content:space-between;margin-top:-34px;gap:12px}.profile-top .avatar{width:76px;height:76px;border:4px solid var(--bg);font-size:20px}.outline-button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:12px;font-weight:700}.profile h2{font-size:21px;letter-spacing:-.6px;margin:12px 0 2px}.profile-bio{font-size:13px;line-height:1.6;margin:12px 0}.stats{display:flex;gap:18px;margin-top:13px}.stats div{display:flex;gap:4px;font-size:12px}.stats strong{font-weight:700}.stats span{color:var(--secondary)}.profile-tabs{height:48px;display:flex;border-bottom:1px solid var(--line)}.profile-tabs button{flex:1;border:0;background:transparent;font-weight:700;font-size:12px;position:relative}.profile-tabs button.active:after{content:"";position:absolute;bottom:0;left:25%;right:25%;height:2px;background:var(--blue);border-radius:2px}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,680px);height:calc(57px + env(safe-area-inset-bottom));padding:4px 20px env(safe-area-inset-bottom);display:flex;justify-content:space-around;align-items:center;background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1px solid var(--line);z-index:6}
    .bottom-nav button{width:52px;height:45px;display:grid;place-items:center;border:0;background:transparent;color:var(--secondary);border-radius:12px}.bottom-nav button.active{color:var(--blue)}.bottom-nav button svg{width:23px;height:23px}
    .modal-backdrop{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:flex-end;justify-content:center}.modal-backdrop.open{display:flex}.sheet{width:min(100%,680px);background:var(--bg);border-radius:20px 20px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--line)}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.sheet h2{font-size:17px;margin:0}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:12px;color:var(--secondary)}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--surface);color:var(--text);font-size:14px}.field textarea{min-height:80px;resize:vertical}.sheet-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,10px);opacity:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:10px;font-size:12px;z-index:30;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100vw - 30px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:681px){.bottom-nav{bottom:0}.app{padding-bottom:70px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <span class="wordmark" id="wordmark">PULSE</span>
      <h1 class="page-title" id="pageTitle" hidden>Profile</h1>
      <div class="header-actions">
        <button class="icon-button" id="headerCompose" aria-label="Write a post"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5Z"/></svg></button>
      </div>
    </header>
    <section class="feed" id="feedView">
      <div class="composer">
        <div class="avatar" id="composerAvatar">P</div>
        <div class="composer-content">
          <textarea id="postInput" maxlength="280" placeholder="What's happening?" rows="2" aria-label="Write a post"></textarea>
          <div class="composer-footer"><span class="count" id="charCount">0 / 280</span><button class="primary" id="publish" disabled>Post</button></div>
        </div>
      </div>
      <div id="posts"></div>
      <div class="empty" id="emptyFeed"><strong>Your feed starts here.</strong><p>Write a post to try out the PULSE interface.</p></div>
    </section>
    <section class="profile" id="profileView">
      <div class="profile-cover"></div>
      <div class="profile-details">
        <div class="profile-top"><div class="avatar" id="profileAvatar">P</div><button class="outline-button" id="editProfile">Edit profile</button></div>
        <h2 id="profileName">PULSE Tester</h2><div class="handle" id="profileHandle">@pulse_tester</div>
        <p class="profile-bio" id="profileBio">Trying out PULSE.</p>
        <div class="stats"><div><strong id="postCount">0</strong><span>Posts</span></div><div><strong>—</strong><span>Followers</span></div><div><strong>—</strong><span>Following</span></div></div>
      </div>
      <div class="profile-tabs"><button class="active">Posts</button></div>
      <div id="profilePosts"></div>
      <div class="empty" id="emptyProfile"><strong>No posts yet</strong><p>Your posts will appear here.</p></div>
    </section>
  </div>
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="active" data-view="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></svg></button>
    <button data-view="profile" aria-label="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
  </nav>
  <div class="modal-backdrop" id="editSheet" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <form class="sheet" id="profileForm">
      <div class="sheet-head"><button type="button" class="icon-button" id="cancelEdit" aria-label="Cancel"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button><h2 id="editTitle">Edit profile</h2><button class="primary" type="submit">Save</button></div>
      <div class="field"><label for="nameField">Name</label><input id="nameField" maxlength="40" value="PULSE Tester" required></div>
      <div class="field"><label for="usernameField">Username</label><input id="usernameField" maxlength="24" value="pulse_tester" required></div>
      <div class="field"><label for="bioField">Bio</label><textarea id="bioField" maxlength="160" placeholder="Write a little about yourself"></textarea></div>
    </form>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const $=id=>document.getElementById(id);
    const state={view:"home",name:"PULSE Tester",username:"pulse_tester",bio:"Trying out PULSE.",posts:[],nextId:1};
    const icons={
      like:'<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg>',
      reply:'<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg>',
      repost:'<svg viewBox="0 0 24 24"><path d="m17 1 4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4m14-2v2a4 4 0 0 1-4 4H3"/></svg>'
    };
    let toastTimer;
    function toast(s){$("toast").textContent=s;$("toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2200)}
    function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
    function initials(s){return s.trim().split(/\s+/).slice(0,2).map(v=>v[0]||"").join("").toUpperCase()||"P"}
    function card(p){return '<article class="post" data-id="'+p.id+'"><div class="post-header"><div class="avatar">'+escapeHTML(p.initials)+'</div><div class="post-person"><strong>'+escapeHTML(p.name)+'</strong><div class="post-meta"><span class="handle">@'+escapeHTML(p.username)+'</span><span class="time">· '+escapeHTML(p.time)+'</span></div></div><button class="more" data-action="more" aria-label="More options">···</button></div><div class="post-text">'+escapeHTML(p.text)+'</div><div class="actions"><button class="action '+(p.liked?"liked":"")+'" data-action="like" aria-label="Like">'+icons.like+'<span>'+p.likes+'</span></button><button class="action" data-action="reply" aria-label="Reply">'+icons.reply+'<span>'+p.replies+'</span></button><button class="action '+(p.reposted?"reposted":"")+'" data-action="repost" aria-label="Repost">'+icons.repost+'<span>'+p.reposts+'</span></button></div></article>'}
    function updateProfile(){$("profileName").textContent=state.name;$("profileHandle").textContent="@"+state.username;$("profileBio").textContent=state.bio;$("profileAvatar").textContent=initials(state.name);$("composerAvatar").textContent=initials(state.name);$("postCount").textContent=state.posts.filter(p=>p.username===state.username).length}
    function render(){
      $("posts").innerHTML=state.posts.map(card).join("");
      const mine=state.posts.filter(p=>p.username===state.username);
      $("profilePosts").innerHTML=mine.map(card).join("");
      $("emptyFeed").style.display=state.posts.length?"none":"block";
      $("emptyProfile").style.display=mine.length?"none":"block";
      updateProfile();
    }
    function setView(view){
      state.view=view;const profile=view==="profile";
      $("feedView").style.display=profile?"none":"block";$("profileView").style.display=profile?"block":"none";
      $("wordmark").hidden=profile;$("pageTitle").hidden=!profile;
      document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
      window.scrollTo({top:0,behavior:"smooth"});
    }
    document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
    $("postInput").addEventListener("input",()=>{const n=$("postInput").value.length;$("charCount").textContent=n+" / 280";$("charCount").classList.toggle("over",n>280);$("publish").disabled=!$("postInput").value.trim()||n>280});
    function publish(){const text=$("postInput").value.trim();if(!text)return;state.posts.unshift({id:state.nextId++,name:state.name,username:state.username,initials:initials(state.name),text,time:"now",likes:0,replies:0,reposts:0,liked:false,reposted:false});$("postInput").value="";$("charCount").textContent="0 / 280";$("publish").disabled=true;render();toast("Added to this preview only");}
    $("publish").addEventListener("click",publish);$("headerCompose").addEventListener("click",()=>{$("postInput").focus();window.scrollTo({top:0,behavior:"smooth"})});
    document.addEventListener("click",e=>{
      const b=e.target.closest("[data-action]");if(!b)return;
      const article=b.closest("[data-id]");const p=state.posts.find(v=>v.id===Number(article?.dataset.id));if(!p)return;
      if(b.dataset.action==="like"){p.liked=!p.liked;p.likes+=p.liked?1:-1;render()}
      else if(b.dataset.action==="repost"){p.reposted=!p.reposted;p.reposts+=p.reposted?1:-1;render();toast(p.reposted?"Reposted in preview":"Repost removed")}
      else if(b.dataset.action==="reply"){const value=prompt("Write a reply (preview only):");if(value?.trim()){p.replies++;render();toast("Reply interaction tested")}}
      else if(b.dataset.action==="more"){toast("More post options can be added here")}
    });
    $("editProfile").addEventListener("click",()=>{$("nameField").value=state.name;$("usernameField").value=state.username;$("bioField").value=state.bio;$("editSheet").classList.add("open")});
    $("cancelEdit").addEventListener("click",()=>$("editSheet").classList.remove("open"));
    $("editSheet").addEventListener("click",e=>{if(e.target===$("editSheet"))$("editSheet").classList.remove("open")});
    $("profileForm").addEventListener("submit",e=>{
      e.preventDefault();const name=$("nameField").value.trim();const username=$("usernameField").value.trim().replace(/^@/,"").replace(/[^a-zA-Z0-9_.]/g,"").toLowerCase();if(!name||!username){toast("Enter a name and username");return}
      const previous=state.username;state.name=name;state.username=username;state.bio=$("bioField").value.trim();
      state.posts.forEach(p=>{if(p.username===previous){p.name=name;p.username=username;p.initials=initials(name)}});
      $("editSheet").classList.remove("open");render();toast("Profile updated in preview");
    });
    render();
  </script>
</body>
</html>
